<!doctype html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false;"
      loading-screen="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      embedded
    >
      <a-assets>
        <a-asset-item id="asset-map"    src="assets/map.glb"></a-asset-item>
        <a-asset-item id="asset-bulb"   src="assets/bulb.glb"></a-asset-item>
        <a-asset-item id="asset-sphere" src="assets/sphere.glb"></a-asset-item>
      </a-assets>


      <a-marker type="pattern" url="markers/letterA.patt">
        <a-entity scale="0.55 0.55 0.55" gltf-model="#asset-map">
        </a-entity>
      </a-marker>

      <a-marker type="pattern" url="markers/letterB.patt">
        <a-entity scale="0.55 0.55 0.55" gltf-model="#asset-bulb">
        </a-entity>
      </a-marker>

      <a-marker type="pattern" url="markers/letterC.patt">
        <a-entity scale="0.55 0.55 0.55" gltf-model="#asset-sphere">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
